name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "APK'yı GitHub Release olarak yayınla (siteden indirilebilir olsun)"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Bağımlılıklar
        run: npm install --no-audit --no-fund

      - name: Testler
        run: npm test

      - name: Web derlemesi (PWA kapalı)
        run: npm run build:cap

      - name: Android projesi
        run: |
          npx cap add android
          npx cap sync android
          # Güncelleme olarak kurulabilmesi için versionCode her derlemede artar.
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"27.${{ github.run_number }}\"/" android/app/build.gradle
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> android/gradle.properties

      - name: Uygulama simgesi ve yerel açılış görseli (Zephyr Manager)
        run: |
          pip install --quiet pillow
          python3 scripts/make-android-icons.py android/app/src/main/res

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # İsteğe bağlı: sabit imza anahtarı. Secrets: KEYSTORE_B64, KEYSTORE_PASS, KEY_ALIAS.
      # Anahtar her derlemede aynı olmazsa telefon "güncelleme" olarak kurmaz (kayıtlar silinir).
      - name: Sabit anahtarla imzala (secrets varsa)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/zm27.keystore"
            BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/zm27.keystore" --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" "$APK"
            echo "APK sabit anahtarla imzalandı."
          else
            echo "::warning::Sabit anahtar yok; APK her derlemede farklı debug anahtarıyla imzalı."
          fi
          cp "$APK" zm27.apk

      - uses: actions/upload-artifact@v4
        with:
          name: zm27-apk
          path: zm27.apk

      # Siteden indirme düğmesi bu release'teki "zm27.apk"yı gösterir. Elle çalıştırırken "publish" işaretlenmeli.
      - name: GitHub Release olarak yayınla
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v27.${{ github.run_number }}
          name: Zephyr Manager 27 — v27.${{ github.run_number }}
          make_latest: true
          files: zm27.apk
          body: |
            Zephyr Manager 27 Android APK (v27.${{ github.run_number }})
            Yeni sürüm: ${{ github.sha }}
            Kurulum: APK'yı indirin, dosyaya dokunun, "bilinmeyen kaynaklardan yüklemeye izin ver" deyin.
